name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build
        run: cmake --build build

      - name: Smoke test
        run: |
          cat > smoke.sql <<'SQL'
          CREATE TABLE t (id INT PRIMARY KEY, v INT);
          INSERT INTO t VALUES (1, 10), (2, 20);
          CREATE TABLE u (id INT PRIMARY KEY, t_id INT);
          INSERT INTO u VALUES (100, 1), (101, 1), (102, 2);
          SELECT t.id, u.id FROM t JOIN u ON t.id = u.t_id ORDER BY u.id;
          SQL
          ./build/db_engine --version
          ./build/db_engine --db smoke-db --script smoke.sql

      - name: Package
        run: |
          mkdir -p stage
          cp build/db_engine stage/
          cp README.md LICENSE stage/
          tar -czf "db-engine-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C stage .
          ls -l "db-engine-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: db-engine-linux
          path: db-engine-*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test
        shell: pwsh
        run: |
          @'
          CREATE TABLE t (id INT PRIMARY KEY, v INT);
          INSERT INTO t VALUES (1, 10), (2, 20);
          CREATE TABLE u (id INT PRIMARY KEY, t_id INT);
          INSERT INTO u VALUES (100, 1), (101, 1), (102, 2);
          SELECT t.id, u.id FROM t JOIN u ON t.id = u.t_id ORDER BY u.id;
          '@ | Set-Content -Encoding utf8 smoke.sql
          .\build\Release\db_engine.exe --version
          .\build\Release\db_engine.exe --db smoke-db --script smoke.sql

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build\Release\db_engine.exe stage\
          Copy-Item README.md, LICENSE stage\
          Compress-Archive -Path stage\* -DestinationPath "db-engine-$env:GITHUB_REF_NAME-windows-x86_64.zip"
          Get-ChildItem "db-engine-*.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: db-engine-windows
          path: db-engine-*.zip
          if-no-files-found: error

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

